name: FareCurve Scraper Pipeline

on:
  schedule:
    # Runs at 00:30, 06:30, 12:30 UTC (approx 06:00, 12:00, 18:00 IST)
    - cron: '30 0,6,12 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  scrape_and_clean:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        playwright install chromium
        
    - name: Run Data Acquisition and Pipeline
      env:
        APIX_DATABASE_URL: ${{ secrets.APIX_DATABASE_URL }}
        APIX_RESPECT_ROBOTS: "true"
      run: |
        # Run the scraper
        python -m apix.cli pipeline-run
