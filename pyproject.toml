[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apix"
version = "1.0.0"
description = "Real-time Airfare Price Index for India (SIH26056 / MoSPI DIID)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "python-dateutil>=2.9",
  "typer>=0.12",
  "rich>=13.7",
  "tenacity>=9.0",
  "groq>=0.11",
  "statsmodels>=0.14",
  "scipy>=1.13",
  "psycopg[binary]>=3.2"
]

[project.optional-dependencies]
scrape = ["playwright>=1.47"]
forecast = ["statsmodels>=0.14", "scipy>=1.13"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "freezegun>=1.5"]

[project.scripts]
apix = "apix.cli:app"

[tool.setuptools.packages.find]
include = ["apix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
