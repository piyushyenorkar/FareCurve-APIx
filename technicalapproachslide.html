<body>
<svg viewBox="0 0 1600 900" width="1600" height="900" xmlns="http://www.w3.org/2000/svg">

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- COLUMN 1: DATA ACQUISITION                                  -->
  <!-- ════════════════════════════════════════════════════════════ -->

  <!-- Phase label -->
  <rect x="770" y="75" width="245" height="22" rx="4" fill="#fef9c3"/>

  <text x="893" y="259" text-anchor="middle" font-size="8" fill="#64748b">PRᵢ = P(today) / P(base period)</text>
